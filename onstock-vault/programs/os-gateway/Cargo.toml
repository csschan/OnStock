[package]
name = "os-gateway"
version = "0.1.0"
description = "OnStock Cross-Chain RWA Gateway — mint/redeem unified osTokens at oracle price"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "os_gateway"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
